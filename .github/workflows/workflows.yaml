name: 'Multi-Architecture Docker Build'
on:
  workflow_call:
    inputs:
      images:
        description: 'Name of images to build'
        required: true
        type: string
      acr-registry-url:
        description: 'The url of the ACR registry to fetch credentials from'
        required: false
        type: string
        default: 'tignis.azurecr.io'
      push:
        description: 'Also push the image to the remote repository'
        required: false
        type: string
        default: 'true'
      docker-build-context:
        description: 'Build context for docker'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Name of the docker file to use'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Comma separated list of platforms to build'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
    secrets:
      acr-username:
        description: 'Username to use when logging into ACR'
        required: true
      acr-password:
        description: 'Password to use when logging into ACR'
        required: true
      pip-extra-index-url:
        description: 'The PIP_EXTRA_INDEX_URL for private pip packages'
        required: false
      uv-index-url:
        description: 'The UV index URL for private packages'
        required: false
      depot-token:
        description: 'Depot token for authentication (optional, enables Depot builds)'
        required: false
      depot-project:
        description: 'Depot project ID (optional, required if using Depot)'
        required: false
      GH_TOKEN:
        description: 'GitHub token for API access'
        required: true
    outputs:
      tag:
        description: 'Final tag used for the multi-architecture docker image'
        value: ${{ jobs.docker-build.outputs.tag }}

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.docker.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Push multi-arch docker image
        id: docker
        uses: tignis/docker-github-action@depot-integration
        with:
          images: ${{ inputs.images }}
          acr-username: ${{ secrets.acr-username }}
          acr-password: ${{ secrets.acr-password }}
          acr-registry-url: ${{ inputs.acr-registry-url }}
          pip-extra-index-url: ${{ secrets.pip-extra-index-url }}
          uv-index-url: ${{ secrets.uv-index-url }}
          push: ${{ inputs.push }}
          docker-build-context: ${{ inputs.docker-build-context }}
          dockerfile: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          depot-token: ${{ secrets.depot-token }}
          depot-project: ${{ secrets.depot-project }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
